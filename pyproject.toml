[project]
name = "explainable_ai"
version = "0.1.0"
description = "Energy Forecast API"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "scikit-learn>=1.2.2",
    "pytest-cov>=4.0.0",
    "mypy>=1.10.0",
    "fastapi>=0.111.1",
    "uvicorn>=0.30.6",
    "pydantic>=2.8.2",
    "xgboost>=2.1.0",
    "pytest>=8.3.2",
    "ruff>=0.6.7"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
pretty = true
files = "src"
mypy_path = "src"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E203", "E501"]

[tool.ruff.format]
quote-style = "preserve"


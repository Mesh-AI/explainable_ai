[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
pretty = true
files = "src"
mypy_path = "src"
ignore_missing_imports = true

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203","W503"]